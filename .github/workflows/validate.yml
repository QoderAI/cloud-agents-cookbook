name: Validate content

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      ASSOCIATION: ${{ github.event.pull_request.author_association }}
    steps:
      - name: Check out trusted tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.BASE_SHA }}
          path: trusted
          persist-credentials: false
      - name: Check out submission as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD_SHA }}
          path: submission
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: trusted/package-lock.json
      - name: Install trusted dependencies
        working-directory: trusted
        run: npm ci --ignore-scripts
      - name: Calculate changed files
        run: git -C submission diff --name-only "$BASE_SHA...$HEAD_SHA" > changed-files.txt
      - name: Enforce contribution scope
        shell: bash
        run: |
          args=(--files changed-files.txt)
          case "$ASSOCIATION" in OWNER|MEMBER|COLLABORATOR) args+=(--allow-infrastructure) ;; esac
          node trusted/scripts/check-contribution-scope.mjs "${args[@]}"
      - name: Test trusted tooling
        working-directory: trusted
        run: npm test
      - name: Validate submission
        run: node trusted/scripts/validate.mjs --root submission --contract-root trusted
      - name: Build normalized catalog
        run: node trusted/scripts/build-catalog.mjs --root submission --contract-root trusted --out-dir artifacts/catalog --source-commit "$HEAD_SHA"
      - name: Upload catalog artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cookbook-catalog-${{ github.event.pull_request.number }}
          path: artifacts/catalog
          retention-days: 3
          if-no-files-found: error
