[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "litellm-qoder-cloud-agents"
version = "0.1.0"
description = "LiteLLM-compatible Agent API and Model API gateway for Qoder Cloud Agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.121.3",
  "pydantic-settings==2.12.0",
  "qca-sdk==0.15.0",
  "uvicorn[standard]==0.38.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.1",
  "pytest-asyncio==1.3.0",
  "ruff==0.14.5",
]

[project.scripts]
litellm-qoder-cloud-agents = "litellm_qoder_cloud_agents.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/litellm_qoder_cloud_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
