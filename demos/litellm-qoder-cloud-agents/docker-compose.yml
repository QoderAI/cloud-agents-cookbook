services:
  qoder-cloud-agents:
    build: .
    env_file: .env
    ports:
      - "4001:4001"

  litellm:
    image: ghcr.io/berriai/litellm:main-stable@sha256:c560d317136880ea92d62334d4367ab10955b1af189dd3ea24f6551290b1d6c1
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file: .env
    volumes:
      - ./config/litellm.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    depends_on:
      - qoder-cloud-agents
